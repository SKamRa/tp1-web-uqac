<!DOCTYPE HTML>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <header>
            <div class="flex-container">
                    <h1 class="left">SuperText</h1>
                    <a href="https://github.com/SKamRa/tp1-web-uqac">
                        <img class="right" src="/images/github.png" alt="Github" width="50px" height="50px">
                    </a>

            </div>
        </header>
        <main>            
            <div class="flex-container w-100">
                <div class="left">
                    <img class="left" src="/images/loginpage.jpg" alt="Login Image" width="700px" height="700px">
                </div>
                <div class="right">
                    <form action="" method="">
                        <label for="username">Nom d'utilisateur :</label>
                        <input type="text" id="username" name="username" required><br><br>
                        <label for="password">Mot de passe :</label>
                        <input type="password" id="password" name="password" required><br><br>
                        <input type="submit" value="Se connecter">
                    </form>
                </div>
            </div>
        </main>
        <footer>
            <div class="bottom">
                <ul class="no-decoration">Fait avec amour par : 
                    <li>DEROUET Nicolas</li>
                    <li>DEVEMY Noé</li>
                </ul>
            </div>
        </footer>
    </body>
</html>
